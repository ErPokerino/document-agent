<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img">
<title>DocuFlow on Google Cloud</title>
<desc>The browser reaches the public Cloud Run service docuflow, which starts the worker job and calls the private model server; the app and the worker use Cloud SQL, the Cloud Storage buckets and Secret Manager, and call Document AI and Gemini; Cloud Build produces the images in Artifact Registry.</desc>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; }
  .label { fill: #5F5E5A; }
  .heading { fill: #444441; }
  .plain rect { fill: #FFFFFF; stroke: #888780; }
  .plain .th { fill: #2C2C2A; } .plain .ts { fill: #5F5E5A; }
  .compute rect { fill: #EEEDFE; stroke: #534AB7; }
  .compute .th { fill: #3C3489; } .compute .ts { fill: #534AB7; }
  .state rect { fill: #E1F5EE; stroke: #0F6E56; }
  .state .th { fill: #085041; } .state .ts { fill: #0F6E56; }
  .outside rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .outside .th { fill: #444441; } .outside .ts { fill: #5F5E5A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .region { fill: none; stroke: #B4B2A9; stroke-dasharray: 4 4; }
  .project { fill: none; stroke: #888780; stroke-dasharray: 5 4; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="plain"><rect x="270" y="20" width="140" height="50" rx="4"/><text x="340" y="40" text-anchor="middle" class="th">Browser</text><text x="340" y="58" text-anchor="middle" class="ts">sign-in screen</text></g>
<line x1="340" y1="70" x2="340" y2="118" class="arr" marker-end="url(#arrow)"/>
<rect x="30" y="90" width="620" height="470" rx="16" class="project"/>
<text x="48" y="112" class="th heading">Google Cloud project · europe-west1</text>
<g class="compute"><rect x="200" y="122" width="280" height="56" rx="4"/><text x="340" y="145" text-anchor="middle" class="th">Cloud Run · docuflow</text><text x="340" y="164" text-anchor="middle" class="ts">frontend + backend · public</text></g>
<path d="M260 178 L260 200 L185 200 L185 224" class="arr" marker-end="url(#arrow)"/>
<path d="M420 178 L420 200 L495 200 L495 224" class="arr" marker-end="url(#arrow)"/>
<g class="compute"><rect x="60" y="226" width="250" height="56" rx="4"/><text x="185" y="249" text-anchor="middle" class="th">Cloud Run job · worker</text><text x="185" y="268" text-anchor="middle" class="ts">Lab runs, experiments, training</text></g>
<g class="compute"><rect x="370" y="226" width="250" height="56" rx="4"/><text x="495" y="249" text-anchor="middle" class="th">Cloud Run · docuflow-llm</text><text x="495" y="268" text-anchor="middle" class="ts">llama.cpp router · one model loaded</text></g>
<line x1="310" y1="254" x2="366" y2="254" class="arr" marker-end="url(#arrow)"/>
<rect x="50" y="318" width="580" height="110" rx="12" class="region"/>
<text x="66" y="338" class="ts label">State and secrets · used by the app and the worker</text>
<path d="M185 282 L185 316" class="arr" marker-end="url(#arrow)"/>
<path d="M495 282 L495 302 L411 302 L411 346" class="arr" marker-end="url(#arrow)"/>
<g class="state"><rect x="66" y="350" width="122" height="56" rx="4"/><text x="127" y="373" text-anchor="middle" class="th">Cloud SQL</text><text x="127" y="392" text-anchor="middle" class="ts">PostgreSQL</text></g>
<g class="state"><rect x="208" y="350" width="122" height="56" rx="4"/><text x="269" y="373" text-anchor="middle" class="th">Cloud Storage</text><text x="269" y="392" text-anchor="middle" class="ts">data and datasets</text></g>
<g class="state"><rect x="350" y="350" width="122" height="56" rx="4"/><text x="411" y="373" text-anchor="middle" class="th">Cloud Storage</text><text x="411" y="392" text-anchor="middle" class="ts">models, catalog</text></g>
<g class="state"><rect x="492" y="350" width="122" height="56" rx="4"/><text x="553" y="373" text-anchor="middle" class="th">Secret Manager</text><text x="553" y="392" text-anchor="middle" class="ts">password, DB</text></g>
<rect x="50" y="446" width="290" height="100" rx="12" class="region"/>
<text x="66" y="466" class="ts label">AI services · called by app and worker</text>
<g class="outside"><rect x="66" y="478" width="118" height="56" rx="4"/><text x="125" y="501" text-anchor="middle" class="th">Document AI</text><text x="125" y="520" text-anchor="middle" class="ts">OCR · eu</text></g>
<g class="outside"><rect x="204" y="478" width="118" height="56" rx="4"/><text x="263" y="501" text-anchor="middle" class="th">Gemini API</text><text x="263" y="520" text-anchor="middle" class="ts">with an API key</text></g>
<rect x="356" y="446" width="274" height="100" rx="12" class="region"/>
<text x="372" y="466" class="ts label">Release · images for Cloud Run</text>
<g class="outside"><rect x="370" y="478" width="96" height="56" rx="4"/><text x="418" y="501" text-anchor="middle" class="th">Build</text><text x="418" y="520" text-anchor="middle" class="ts">Cloud Build</text></g>
<line x1="466" y1="506" x2="492" y2="506" class="arr" marker-end="url(#arrow)"/>
<g class="outside"><rect x="496" y="478" width="122" height="56" rx="4"/><text x="557" y="501" text-anchor="middle" class="th">Images</text><text x="557" y="520" text-anchor="middle" class="ts">Artifact Registry</text></g>
</svg>
