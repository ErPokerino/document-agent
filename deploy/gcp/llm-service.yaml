# Open models served by llama.cpp on Cloud Run CPUs, behind Google sign-in:
# only the app's service account may call it. It answers the OpenAI-compatible
# API DocuFlow's model server provider speaks (backend/app/services/model_server.py).
#
# Router mode: the server knows every model in models.ini (written by
# upload-models.sh beside the GGUF files) and holds one at a time. DocuFlow
# loads the selected one explicitly (POST /models/load) and warms it, as it
# does with LM Studio; loading another unloads the previous. Context and
# parallelism match the profile DocuFlow loads LM Studio with.
#
# CPU stays allocated between requests, because a model goes on loading after
# the request that asked for it has returned. The service still scales to
# zero when idle, and the model it held is then gone until loaded again.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${PREFIX}-llm
  labels:
    cloud.googleapis.com/location: ${REGION}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: ${LLM_SA}
      # Requests queue inside llama.cpp rather than start another instance.
      containerConcurrency: 8
      timeoutSeconds: 900
      containers:
        - image: ${IMAGE_REPO}/llama-cpp-server:${TAG}
          args:
            - "--models-preset"
            - "/models/models.ini"
            - "--models-max"
            - "1"
            - "--no-models-autoload"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--ctx-size"
            - "8192"
            - "--parallel"
            - "1"
            - "--threads"
            - "${LLM_CPU}"
            - "--jinja"
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "${LLM_CPU}"
              memory: ${LLM_MEMORY}
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          csi:
            driver: gcsfuse.run.googleapis.com
            readOnly: true
            volumeAttributes:
              bucketName: ${MODELS_BUCKET}
