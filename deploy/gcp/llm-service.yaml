# An open model served by llama.cpp on Cloud Run CPUs, behind Google sign-in:
# only the app's service account may call it. It answers the OpenAI-compatible
# API DocuFlow's model server provider speaks (backend/app/services/model_server.py).
# Scales to zero; the first request after a pause waits for the model to load.
# Context and parallelism match the profile DocuFlow loads LM Studio with.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${PREFIX}-llm
  labels:
    cloud.googleapis.com/location: ${REGION}
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: ${LLM_SA}
      # Requests queue inside llama.cpp rather than start another instance.
      containerConcurrency: 4
      timeoutSeconds: 900
      containers:
        - image: ${IMAGE_REPO}/llama-cpp-server:${TAG}
          args:
            - "--model"
            - "/models/${LLM_MODEL_FILE}"
            - "--mmproj"
            - "/models/${LLM_PROJECTOR_FILE}"
            - "--alias"
            - "${LLM_MODEL_NAME}"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--ctx-size"
            - "8192"
            - "--parallel"
            - "1"
            - "--threads"
            - "8"
            - "--jinja"
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "8"
              memory: 16Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          csi:
            driver: gcsfuse.run.googleapis.com
            readOnly: true
            volumeAttributes:
              bucketName: ${MODELS_BUCKET}
